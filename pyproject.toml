[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hfms-bridge"
version = "0.5.1"
description = "Stream models and datasets between HuggingFace and ModelScope"
readme = "docs/README.md"
authors = [{ name = "ExcitingMe" }]
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["huggingface", "modelscope", "datasets", "models", "streaming", "transfer", "cli"]
dependencies = ["requests>=2.32.3,<3", "filelock>=3.16,<4", "tqdm>=4.66,<5"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Utilities",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/feixyz10/hfms-bridge/"
Source = "https://github.com/feixyz10/hfms-bridge/"
Issues = "https://github.com/feixyz10/hfms-bridge/issues"

[project.scripts]
hfms-bridge = "hfms_bridge.cli:main"
hfms-download = "hfms_bridge.download_cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Keep release metadata compatible with Twine 6 validation.
[tool.hatch.build.targets.wheel]
packages = ["src/hfms_bridge"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
